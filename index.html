<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar - Cultura Nacional</title>
    <link rel="stylesheet" href="./public/css/styles.css">
</head>
<body>
    <header class="header-militante">
        <div class="top-bar">
            <img src="./public/images/arg-flag.png" alt="Bandera Argentina" class="bandera" style="background: #75aadb;">
            <h1>CULTURA NACIONAL</h1>
            <img src="./public/images/antifa-flag.png" alt="Bandera Antifa" class="bandera" style="background: #cc0000;">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productCart.html">Carrito</a></li>
                <li><a href="login.html">Ingresar</a></li>
                <li><a href="register.html">Registrarse</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="form-container">
            <h2>Iniciar Sesión</h2>
            <form action="/" method="GET">
                <div class="control-formulario">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" required placeholder="tu@email.com">
                </div>
                <div class="control-formulario">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required placeholder="********">
                </div>
                <button type="submit" class="btn-ver">Ingresar</button>
            </form>
            <p>¿No tenés cuenta? <a href="register.html">Registrate acá</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Cultura Nacional - Organización y lucha.</p>
    </footer>
</body>
</html>
