<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Producto - Cultura Nacional</title>
    <link rel="stylesheet" href="./public/css/styles.css">
</head>
<body>
    <header class="header-militante">
        <div class="top-bar">
            <img src="./bandera.jpg.jpg" alt="Bandera Argentina" class="bandera-decorativa">
            <h1>CULTURA NACIONAL</h1>
            <img src="./antifa.jpg.jpg" alt="Bandera Antifa" class="bandera-decorativa">
        </div>
       <nav>
            <ul>
                <li><a href="/">Inicio</a></li>
                <li><a href="/carrito">Carrito</a></li>
                <li><a href="login.html">Ingresar / Registrarse</a></li>
            </ul>
        </nav>
    </header>

    <main style="display: flex; justify-content: center; padding: 3rem 1rem;">
        <section style="background-color: #1a1a1a; padding: 3rem; border-radius: 8px; border: 1px solid #333; display: flex; gap: 3rem; max-width: 900px; width: 100%; flex-wrap: wrap;">
            
            <!-- Imagen dinámica del producto -->
            <div style="flex: 1; min-width: 300px;">
                <img id="img-producto" src="./che.jpg.jpeg" alt="Remera" style="width: 100%; height: auto; border-radius: 4px; object-fit: cover; border: 1px solid #444;">
            </div>

            <!-- Información dinámica del producto -->
            <div style="flex: 1; min-width: 300px; display: flex; flex-direction: column; justify-content: center;">
                <h2 id="titulo-producto" style="color: white; margin-top: 0; margin-bottom: 1rem; font-size: 2rem;">Cargando...</h2>
                <p style="color: #cc0000; font-size: 1.8rem; font-weight: bold; margin-bottom: 1.5rem;">$18.000</p>
                
                <p id="descripcion-producto" style="color: #ccc; line-height: 1.6; margin-bottom: 2rem;">
                    Cargando información histórica del producto...
                </p>

                <div style="margin-bottom: 2rem;">
                    <label style="color: white; margin-right: 1rem; font-weight: bold;">Talle:</label>
                    <select style="padding: 0.5rem; background-color: #222; color: white; border: 1px solid #444; border-radius: 4px;">
                        <option value="S">S</option>
                        <option value="M">M</option>
                        <option value="L">L</option>
                        <option value="XL">XL</option>
                        <option value="XXL">XXL</option>
                    </select>
                </div>

                <a href="/carrito" style="background-color: #cc0000; color: white; border: none; padding: 1rem; font-size: 1.1rem; font-weight: bold; cursor: pointer; border-radius: 4px; text-transform: uppercase; text-decoration: none; text-align: center; display: inline-block;">
                    Agregar al carrito
                </a>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Cultura Nacional - Organización, memoria y lucha.</p>
    </footer>

    <!-- Script que levanta los datos de cada uno de los 8 personajes -->
    <script>
        const productos = {
            che: {
                nombre: 'Ernesto "Che" Guevara',
                img: './che.jpg.jpeg',
                desc: 'Frase inmortalizada en su carta de despedida a Fidel Castro, símbolo universal de la lucha antiimperialista y la emancipación de los pueblos.'
            },
            favaloro: {
                nombre: 'Dr. René Favaloro',
                img: './favaloro.jpg.jpeg',
                desc: 'Estandarte ético frente a la corrupción estructural y el vaciamiento de la salud y la educación pública en la Argentina.'
            },
            soto: {
                nombre: 'José Font "Patón" Soto',
                img: './soto.jpg.jpeg',
                desc: 'Líder libertario de las huelgas patagónicas de 1921 en Santa Cruz, firme en la lucha obrera contra los fusilamientos de la estancia La Anita.'
            },
            bairoletto: {
                nombre: 'Juan Bautista Bairoletto',
                img: './bairoletto.jpg.jpeg',
                desc: 'Bandido rural y justicia criollo de la década del \'30, protector de los desposeídos frente a los abusos de los terratenientes.'
            },
            facon: {
                nombre: 'Facón Grande (Huelgas Patagónicas)',
                img: './facon.jpg.jpeg',
                desc: 'Reclamo histórico exigiendo dignidad y respeto por la vida de los trabajadores rurales explotados en la Patagonia trágica.'
            },
            indio: {
                nombre: 'Indio Solari / Patricio Rey',
                img: './indio.jpg.jpeg',
                desc: 'Himno del rock contestatario sobre la autonomía mental, la autogestión y el cuidado de la libertad frente al aparato hegemónico.'
            },
            durruti: {
                nombre: 'Buenaventura Durruti',
                img: './durruti.jpg.jpeg',
                desc: 'Máxima anarcosindicalista de combate directo frente al avance autoritario en la Revolución Española y la resistencia global.'
            },
            marx: {
                nombre: 'Karl Marx',
                img: './marx.jpg.jpeg',
                desc: 'Cierre del Manifiesto Comunista, llamado universal a la abolición de la explotación asalariada y la emancipación obrera.'
            }
        };

        const params = new URLSearchParams(window.location.search);
        const id = params.get('id') || 'che';

        if (productos[id]) {
            document.getElementById('titulo-producto').innerText = productos[id].nombre;
            document.getElementById('img-producto').src = productos[id].img;
            document.getElementById('descripcion-producto').innerText = productos[id].desc;
        }
    </script>
</body>
</html>
