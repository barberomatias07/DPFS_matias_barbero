<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar - Cultura Nacional</title>
    <link rel="stylesheet" href="./public/css/styles.css">
</head>
<body>
    <header class="header-militante">
        <div class="top-bar">
            <img src="./bandera.jpg.jpg" alt="Bandera Argentina" class="bandera-decorativa">
            <h1>CULTURA NACIONAL</h1>
            <img src="./antifa.jpg.jpg" alt="Bandera Antifa" class="bandera-decorativa">
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="productCart.html">Carrito</a></li>
                <li><a href="login.html">Ingresar / Registrarse</a></li>
            </ul>
        </nav>
    </header>

    <main style="display: flex; justify-content: center; padding: 3rem 1rem; background-color: #111;">
        <!-- Contenedor forzado a color oscuro para tapar el parche blanco -->
        <div style="background-color: #1a1a1a; padding: 2.5rem; border-radius: 8px; border: 1px solid #333; width: 100%; max-width: 450px;">
            
            <!-- Iniciar Sesión -->
            <section style="margin-bottom: 2.5rem; text-align: center;">
                <h2 style="color: white; margin-bottom: 1.5rem;">Iniciar Sesión</h2>
                <form style="display: flex; flex-direction: column; gap: 1rem; text-align: left;">
                    <div>
                        <label style="color: #ccc; display: block; margin-bottom: 0.5rem;">Correo electrónico:</label>
                        <input type="email" placeholder="tu@email.com" style="width: 100%; padding: 0.8rem; background-color: #222; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box;">
                    </div>
                    <div>
                        <label style="color: #ccc; display: block; margin-bottom: 0.5rem;">Contraseña:</label>
                        <input type="password" placeholder="********" style="width: 100%; padding: 0.8rem; background-color: #222; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box;">
                    </div>
                    <button type="submit" style="background-color: #cc0000; color: white; padding: 12px; border: none; cursor: pointer; font-weight: bold; margin-top: 1rem; text-transform: uppercase;">Ingresar</button>
                </form>
            </section>

            <hr style="border-color: #333; margin-bottom: 2.5rem;">

            <!-- Crear Cuenta -->
            <section style="text-align: center;">
                <h2 style="color: white; margin-bottom: 1.5rem;">Crear Cuenta</h2>
                <form style="display: flex; flex-direction: column; gap: 1rem; text-align: left;">
                    <div>
                        <label style="color: #ccc; display: block; margin-bottom: 0.5rem;">Nombre completo:</label>
                        <input type="text" placeholder="Juan Pérez" style="width: 100%; padding: 0.8rem; background-color: #222; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box;">
                    </div>
                    <div>
                        <label style="color: #ccc; display: block; margin-bottom: 0.5rem;">Correo electrónico:</label>
                        <input type="email" placeholder="tu@email.com" style="width: 100%; padding: 0.8rem; background-color: #222; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box;">
                    </div>
                    <div>
                        <label style="color: #ccc; display: block; margin-bottom: 0.5rem;">Contraseña:</label>
                        <input type="password" placeholder="********" style="width: 100%; padding: 0.8rem; background-color: #222; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box;">
                    </div>
                    <button type="submit" style="background-color: #333; color: white; padding: 12px; border: 1px solid #555; cursor: pointer; font-weight: bold; margin-top: 1rem; text-transform: uppercase;">Registrarse</button>
                </form>
            </section>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Cultura Nacional - Organización y lucha.</p>
    </footer>
</body>
</html>
